name: team_attendance
description: Team Attendance - Staff attendance app. Daily check in and check out, today register, monthly summaries, history and CSV export, with local persistence.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  fl_chart: ^1.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  excel_community: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
